spring:
  application:
    name: MADiE User Service
  mongodb:
    database: ${MONGO_DATABASE:user}
    uri: ${MONGO_URI:mongodb://${DBUSER}:${DBPASS}@localhost:27017/user}?authSource=admin&maxPoolSize=50&connectTimeoutMS=2000&serverSelectionTimeoutMS=2000
  data:
    mongodb:
      auto-index-creation: true

server:
  port: 8088
  servlet:
    context-path: /api

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{dd-MM-yyyy HH:mm:ss.SSS} [%thread] %mdc %-5level %logger{36}.%M - %msg%n"

# User update job scheduler configuration
user:
  update:
    # Cron expression for scheduling the user update job
    cron-expression: ${USER_UPDATE_CRON:-}

harp:
  base-url: ${HARP_BASE_URL:https://test.harp.cms.gov}
  program-name: MADiE
  ado-name: MADiE
  token:
    uri: /harpAuthzApi/token
    scope: userRoleCreationApi userFindApi
    client-id: ${HARP_CLIENT_ID:}
    secret: ${HARP_SECRET:}
  user-roles:
    uri: /userRoleCreationApi
  user-find:
    uri: /userFindApi
  test:
    override-id: ${HARP_LOCAL_OVERRIDE_ID:}

okta:
  oauth2:
    issuer: ${OKTA_ISSUER:https://dev-madie.okta.com/oauth2/default}
    audience: ${OKTA_AUDIENCE:api://default}

excel-export-service:
  base-url: ${EXCEL_EXPORT_SERVICE:http://localhost:3000/api}

measure-service:
  base-url: ${MEASURE_SERVICE_URL:http://localhost:8080/api}
  # Connection pool must be >= user-export.concurrency so the parallel export fan-out is not
  # throttled by the per-route connection limit.
  max-connections: ${MEASURE_SERVICE_MAX_CONNECTIONS:20}
  connect-timeout-millis: ${MEASURE_SERVICE_CONNECT_TIMEOUT_MS:5000}
  connection-request-timeout-millis: ${MEASURE_SERVICE_CONN_REQUEST_TIMEOUT_MS:5000}
  response-timeout-millis: ${MEASURE_SERVICE_RESPONSE_TIMEOUT_MS:60000}

# Full User Export: number of users whose measures are fetched from measure-service in parallel.
user-export:
  concurrency: ${USER_EXPORT_CONCURRENCY:16}

